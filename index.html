    <script>
      // Automatic GitHub Pages Direct-Branch Bootloader:
      // When published directly from AI Studio to a GitHub repo (e.g., https://bhvsy.github.io/24Tools/)
      // where GitHub Pages serves the raw 'main' branch root before/without a Vite build step,
      // /src/main.tsx cannot run natively in the browser. This bootloader detects raw static hosting
      // and mounts the pre-compiled production bundle from ./public/gh-pages-bundle/ automatically.
      (function () {
        var hasRawTsxTag = Boolean(document.querySelector('script[src="/src/main.tsx"]'));
        var isGitHubPages = location.hostname.endsWith('github.io');
        function loadPrebuiltBundle() {
          if (window.__BHVSY_BUNDLE_LOADED__) return;
          window.__BHVSY_BUNDLE_LOADED__ = true;
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './public/gh-pages-bundle/app.css';
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.src = './public/gh-pages-bundle/app.js';
          document.body.appendChild(js);
        }
        if (isGitHubPages && hasRawTsxTag) {
          loadPrebuiltBundle();
        } else if (hasRawTsxTag) {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.children.length === 0) {
              loadPrebuiltBundle();
            }
          }, 800);
        }
      })();
    </script>
